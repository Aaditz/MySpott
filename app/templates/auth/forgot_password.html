{% extends "base.html" %}
{% block title %}Forgot your password? · MySpott{% endblock %}
{% block content %}
  <h1>Forgot your password?</h1>
  <p>Enter your email address and we will send you a link to choose a new one.</p>
  <form method="post" action="{{ url_for('auth.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="email">Email address</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required maxlength="254">
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

    <p><button type="submit">Send reset link</button></p>
  </form>
  <p><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
{% endblock %}
