{% extends "base.html" %}
{% block title %}Confirm your email &middot; MySpott{% endblock %}
{% block content %}
  <div class="auth-card card">
    <h1>Confirm your email address</h1>
    <p class="text-muted">Press the button to finish confirming your MySpott account.</p>

    <form method="post" action="{{ url_for('auth.verify_email_submit', token=token) }}" data-submit-once data-loading-text="Confirming…">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-primary btn-block">Confirm my email address</button>
    </form>
  </div>
{% endblock %}
