{% extends "base.html" %}
{% block title %}Choose a new password · MySpott{% endblock %}
{% block content %}
  <h1>Choose a new password</h1>
  <form method="post" action="{{ url_for('auth.reset_password_submit', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="password">New password (at least 8 characters)</label>
    <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" maxlength="128">
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

    <p><button type="submit">Change password</button></p>
  </form>
{% endblock %}
