{% extends "base.html" %}
{% block title %}Log in &middot; MySpott{% endblock %}
{% block content %}
  <div class="auth-card card">
    <h1>Log in</h1>
    <p class="text-muted">Welcome back.</p>

    {% if error %}
      <div class="form-alert" role="alert" id="login-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('auth.login') }}" data-submit-once data-loading-text="Logging in…">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" autocapitalize="off" spellcheck="false" required maxlength="254"{% if error %} aria-describedby="login-error"{% endif %}>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" autocomplete="current-password" required maxlength="128"{% if error %} aria-describedby="login-error"{% endif %}>
          <button type="button" class="password-toggle" data-password-toggle aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
      </div>

      <p class="auth-forgot"><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>

      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-footer">New to MySpott? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
{% endblock %}
