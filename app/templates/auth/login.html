{% extends "base.html" %}
{% block title %}Log in · MySpott{% endblock %}
{% block content %}
  <h1>Log in</h1>
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}

    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

    <label for="email">Email address</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" autocomplete="email" required maxlength="254">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required maxlength="128">

    <p><button type="submit">Log in</button></p>
  </form>
  <p><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>
  <p>New to MySpott? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
{% endblock %}
